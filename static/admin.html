<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>VertHurt Admin</title>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/css/verthurt.css">
<link rel="stylesheet" href="/css/components.css">
<link rel="stylesheet" href="/css/admin.css">
</head>
<body>

<div class="admin-header">
  <h1><span>VertHurt</span> Admin</h1>
  <div class="admin-header-right">
    <a href="/app.html">&larr; Back to App</a>
    <span id="adminUserName" style="font-size:0.85rem;color:#6B7280;"></span>
    <button class="btn-ghost dark-mode-toggle" id="darkModeToggle" onclick="toggleDarkMode()" title="Toggle theme: Dark / Light / System">🖥️</button>
  </div>
</div>

<div class="admin-container">
  <div class="admin-tabs">
    <button class="admin-tab active" data-tab="dashboard" onclick="switchTab('dashboard')">Dashboard</button>
    <button class="admin-tab" data-tab="users" onclick="switchTab('users')">Users</button>
    <button class="admin-tab" data-tab="routes" onclick="switchTab('routes')">Saved Routes</button>
    <button class="admin-tab" data-tab="scored" onclick="switchTab('scored')">All Scored</button>
  </div>

  <!-- Dashboard -->
  <section id="dashboardSection" class="admin-section visible">
    <div class="stats-grid" id="statsGrid">
      <div class="stat-card"><div class="label">Total Users</div><div class="value" id="statUsers">-</div></div>
      <div class="stat-card"><div class="label">New Users (7d)</div><div class="value" id="statNew7d">-</div></div>
      <div class="stat-card"><div class="label">New Users (30d)</div><div class="value" id="statNew30d">-</div></div>
      <div class="stat-card"><div class="label">Saved Routes</div><div class="value" id="statRoutes">-</div></div>
      <div class="stat-card"><div class="label">All Scored</div><div class="value" id="statScored">-</div></div>
      <div class="stat-card"><div class="label">Waitlist</div><div class="value" id="statWaitlist">-</div></div>
    </div>
    <div class="rescore-panel" id="rescorePanel" style="display:none">
      <div class="rescore-panel-info">
        <strong id="rescoreHeading">-</strong>
        <span id="rescoreSubtext" style="color:#6B7280;font-size:0.875rem;"></span>
      </div>
      <button class="btn-primary" id="rescoreBtn" onclick="rescoreRoutes()">Rescore stale routes</button>
    </div>
    <div id="rescoreResult" style="margin-top:12px;font-size:0.875rem;"></div>
  </section>

  <!-- Users -->
  <section id="usersSection" class="admin-section">
    <div class="search-bar">
      <input type="text" id="userSearch" placeholder="Search by email or name..." oninput="debounceUserSearch()">
    </div>
    <div class="admin-table-wrap">
      <table class="admin-table">
        <thead>
          <tr>
            <th onclick="sortUsers('email')">Email <span class="sort-arrow" id="sort-users-email"></span></th>
            <th onclick="sortUsers('name')">Name <span class="sort-arrow" id="sort-users-name"></span></th>
            <th onclick="sortUsers('auth_method')">Auth <span class="sort-arrow" id="sort-users-auth_method"></span></th>
            <th>Admin</th>
            <th onclick="sortUsers('created_at')">Created <span class="sort-arrow" id="sort-users-created_at"></span></th>
            <th onclick="sortUsers('last_login')">Last Login <span class="sort-arrow" id="sort-users-last_login"></span></th>
            <th>Actions</th>
          </tr>
        </thead>
        <tbody id="usersTableBody"></tbody>
      </table>
      <div class="pagination" id="usersPagination"></div>
    </div>
  </section>

  <!-- Routes -->
  <section id="routesSection" class="admin-section">
    <div class="search-bar">
      <input type="text" id="routeSearch" placeholder="Search by route name..." oninput="debounceRouteSearch()">
    </div>
    <div class="admin-table-wrap">
      <table class="admin-table">
        <thead>
          <tr>
            <th onclick="sortRoutes('name')">Name <span class="sort-arrow" id="sort-routes-name"></span></th>
            <th onclick="sortRoutes('composite')">Score <span class="sort-arrow" id="sort-routes-composite"></span></th>
            <th>Descriptor</th>
            <th onclick="sortRoutes('totalDist')">Distance <span class="sort-arrow" id="sort-routes-totalDist"></span></th>
            <th onclick="sortRoutes('totalGain')">Gain <span class="sort-arrow" id="sort-routes-totalGain"></span></th>
            <th onclick="sortRoutes('created_at')">Created <span class="sort-arrow" id="sort-routes-created_at"></span></th>
            <th>GPX</th>
          </tr>
        </thead>
        <tbody id="routesTableBody"></tbody>
      </table>
      <div class="pagination" id="routesPagination"></div>
    </div>
  </section>

  <!-- Scored Routes -->
  <section id="scoredSection" class="admin-section">
    <div class="search-bar">
      <input type="text" id="scoredSearch" placeholder="Search by route name..." oninput="debounceScoredSearch()">
    </div>
    <div class="admin-table-wrap">
      <table class="admin-table">
        <thead>
          <tr>
            <th onclick="sortScored('name')">Name <span class="sort-arrow" id="sort-scored-name"></span></th>
            <th onclick="sortScored('composite')">Score <span class="sort-arrow" id="sort-scored-composite"></span></th>
            <th>Descriptor</th>
            <th onclick="sortScored('total_dist_km')">Distance <span class="sort-arrow" id="sort-scored-total_dist_km"></span></th>
            <th onclick="sortScored('total_gain')">Gain <span class="sort-arrow" id="sort-scored-total_gain"></span></th>
            <th onclick="sortScored('scored_at')">Scored At <span class="sort-arrow" id="sort-scored-scored_at"></span></th>
            <th>GPX</th>
          </tr>
        </thead>
        <tbody id="scoredTableBody"></tbody>
      </table>
      <div class="pagination" id="scoredPagination"></div>
    </div>
  </section>
</div>

<!-- Edit User Modal -->
<div class="modal-overlay" id="editUserModal">
  <div class="modal-box">
    <h3>Edit User</h3>
    <input type="hidden" id="editUserId">
    <label>First Name</label>
    <input type="text" id="editFirstName">
    <label>Last Name</label>
    <input type="text" id="editLastName">
    <label>Email</label>
    <input type="email" id="editEmail">
    <div class="checkbox-row">
      <input type="checkbox" id="editIsAdmin">
      <label for="editIsAdmin" style="margin-bottom:0;">Admin access</label>
    </div>
    <div class="modal-actions">
      <button class="btn-secondary" onclick="closeEditModal()">Cancel</button>
      <button class="btn-primary" onclick="saveUser()">Save Changes</button>
    </div>
    <div class="danger-zone">
      <button class="btn-delete" onclick="deleteUser()">Delete User</button>
    </div>
  </div>
</div>

<script>
var _themeMQ = window.matchMedia('(prefers-color-scheme: dark)');
function _getSystemTheme() { return _themeMQ.matches ? 'dark' : 'light'; }
function applyTheme() {
  var pref = localStorage.getItem('verthurt-theme');
  var theme = (pref === 'dark' || pref === 'light') ? pref : _getSystemTheme();
  document.documentElement.setAttribute('data-theme', theme);
  _updateToggleIcon(pref);
}
function _updateToggleIcon(pref) {
  var btn = document.getElementById('darkModeToggle');
  if (!btn) return;
  if (pref === 'dark') btn.textContent = '🌙';
  else if (pref === 'light') btn.textContent = '☀️';
  else btn.textContent = '🖥️';
}
function toggleDarkMode() {
  var pref = localStorage.getItem('verthurt-theme');
  if (!pref) { pref = 'dark'; }
  else if (pref === 'dark') { pref = 'light'; }
  else { pref = null; }
  if (pref) localStorage.setItem('verthurt-theme', pref);
  else localStorage.removeItem('verthurt-theme');
  applyTheme();
}
applyTheme();
_themeMQ.addEventListener('change', applyTheme);
</script>
<script src="/js/admin.js"></script>
</body>
</html>
